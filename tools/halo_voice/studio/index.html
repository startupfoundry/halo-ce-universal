<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Studio</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --line: #e2e2dc;
  --accent: #2f6f4f; --accent-fg: #ffffff; --pick: #e6f2ea; --best: #2f6f4f;
  --warn: #9a5b00; --warn-bg: #fff3dd; --bad: #a33a2c; --bad-bg: #fbe9e6; --good-bg: #e6f2ea;
  --chip: #eeeee9; --user: #2c5d9e; --claude: #8a4f1d; --worker: #6b6b66;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151514; --panel: #1e1e1c; --fg: #ecece8; --muted: #9c9c95; --line: #33332f;
    --accent: #5fae86; --accent-fg: #0d1a13; --pick: #1d3327; --best: #5fae86;
    --warn: #e0a64a; --warn-bg: #3a2c12; --bad: #e57c6c; --bad-bg: #3a1e19; --good-bg: #1d3327;
    --chip: #2a2a27; --user: #7fa8e0; --claude: #e0a271; --worker: #9c9c95;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; }
header .grow { flex: 1; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
section, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
h2 { font-size: 15px; margin: 0 0 8px; }
h3 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
small, .muted { color: var(--muted); }
button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 6px;
  padding: 3px 9px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }
button.play { width: 30px; padding: 3px 0; text-align: center; }
button.play.playing { background: var(--accent); color: var(--accent-fg); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 6px; }
textarea { width: 100%; min-height: 48px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--chip); font-size: 12px; }
.chip.hype { background: var(--bad-bg); color: var(--bad); }
.chip.calm { background: var(--good-bg); color: var(--accent); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.status-queued { color: var(--muted); } .status-running { color: var(--warn); font-weight: 600; }
.status-done { color: var(--accent); } .status-failed { color: var(--bad); font-weight: 600; } .status-cancelled { color: var(--muted); }
.by-user { color: var(--user); font-weight: 600; } .by-claude { color: var(--claude); font-weight: 600; } .by-worker { color: var(--worker); }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.picked td { background: var(--pick); }
tr.stale td { opacity: .6; }
.num { font-variant-numeric: tabular-nums; }
.card-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.card-head .name { font-weight: 700; font-size: 15px; }
.card-head .text { font-size: 16px; }
.card.archived { opacity: .65; }
.tools { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.tools > div { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.originals { display: grid; gap: 8px; }
.clip { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; }
.comments { margin-top: 6px; }
.comment { padding: 4px 0; border-bottom: 1px solid var(--line); }
.comment.reply { margin-left: 22px; }
.comment p { margin: 2px 0; white-space: pre-wrap; }
.log { font: 12px/1.35 ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px; max-height: 260px; overflow: auto; white-space: pre-wrap; margin: 4px 0 8px; }
.feed { max-height: 360px; overflow: auto; }
.feed div { padding: 2px 0; border-bottom: 1px solid var(--line); }
.rating-note { font-size: 12px; color: var(--muted); }
details > summary { cursor: pointer; }
.error { color: var(--bad); }
@media (max-width: 700px) { main { padding: 10px; } .hide-narrow { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Voice Studio</h1>
  <span id="worker" class="muted"></span>
  <span class="grow"></span>
  <button id="install" class="primary" title="Copy every line's picked take into the game's test data folder (voice/)">Install picks</button>
  <a href="/api" target="_blank"><small>API</small></a>
</header>
<main>
  <section>
    <details id="refs-details">
      <summary><h2 style="display:inline">The announcer's own clips</h2> <small>(click to compare)</small></summary>
      <div id="refs" class="originals"></div>
    </details>
  </section>
  <section>
    <h2>Jobs</h2>
    <div id="jobs" class="wrap"></div>
  </section>
  <section>
    <h2>New line</h2>
    <form id="add" class="row">
      <input name="name" placeholder="name (overtime)" pattern="[a-z0-9_]{1,31}" required size="16">
      <input name="text" placeholder="What the announcer says" required size="36">
      <select name="style"><option value="calm">calm</option><option value="hype">hype</option></select>
      <label>takes <select name="generate"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
      <button class="primary">Add</button>
    </form>
  </section>
  <div id="lines" style="display:grid;gap:16px"></div>
  <section>
    <details>
      <summary><h2 style="display:inline">Archived lines</h2></summary>
      <div id="archived" style="display:grid;gap:12px;margin-top:8px"></div>
    </details>
  </section>
  <section>
    <h2>Activity</h2>
    <div id="feed" class="feed"></div>
  </section>
</main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v, d = 3) => v === null || v === undefined ? "" : Number(v).toFixed(d);
const when = iso => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}); };
const who = by => `<span class="by-${esc(by)}">${by === "user" ? "you" : esc(by)}</span>`;

let state = null, version = 0;
const rendered = new Map();    // line name -> JSON last drawn
const openLogs = new Set();    // job ids whose log is shown

// one player for everything, outside the page's redrawn parts
const player = new Audio();
let playingUrl = null;
function markPlaying() {
  document.querySelectorAll("button.play").forEach(b => {
    const on = b.dataset.src === playingUrl && !player.paused;
    b.classList.toggle("playing", on); b.textContent = on ? "■" : "▶";
  });
}
player.addEventListener("ended", () => { playingUrl = null; markPlaying(); });
player.addEventListener("pause", markPlaying);
player.addEventListener("play", markPlaying);
document.addEventListener("click", e => {
  const b = e.target.closest("button.play"); if (!b) return;
  if (playingUrl === b.dataset.src && !player.paused) { player.pause(); playingUrl = null; markPlaying(); return; }
  playingUrl = b.dataset.src; player.src = b.dataset.src; player.currentTime = 0;
  player.play().catch(err => alert("cannot play: " + err)); markPlaying();
});
const play = (url, title = "") => url ? `<button class="play" data-src="${esc(url)}" title="${esc(title)}">▶</button>` : "";

async function api(method, path, body) {
  const opts = {method, headers: {}};
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(Object.assign({by: "user"}, body)); }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) { alert(data.error || r.statusText); throw new Error(data.error); }
  return data;
}
const post = (path, body = {}) => api("POST", path, body);

// ---------- the reference strip
async function loadOriginals() {
  const o = await api("GET", "/api/originals");
  const groups = {calm: "Calm (the calm reference's style)", hype: "Hype (the hype reference's style)", other: "Other clips"};
  let html = `<div><b>Reference montages</b> (what the model imitates): ` +
    Object.entries(o.references).map(([s, r]) => `<span class="clip">${play(r.url, r.text)} ${esc(s)}</span>`).join("") + `</div>`;
  for (const [g, title] of Object.entries(groups)) {
    const clips = o.clips.filter(c => c.group === g);
    html += `<div><b>${title}</b><br>` + clips.map(c =>
      `<span class="clip">${play(c.url, c.name)}<span title="${esc(c.name)}${c.similarity ? " · voice " + fmt(c.similarity) : ""}">${esc(c.text)}</span></span>`).join("") + `</div>`;
  }
  if (o.similarity) html += `<small>Voice similarity of the clips to the others: ${fmt(o.similarity.min)}–${fmt(o.similarity.max)} (median ${fmt(o.similarity.median)}): the scale for the takes' scores.</small>`;
  $("#refs").innerHTML = html;
}

// ---------- jobs
function renderJobs() {
  const w = state.worker;
  $("#worker").innerHTML = w.alive ? (w.running ? `worker: running job ${w.running}` : "worker: idle") + (w.queued ? `, ${w.queued} queued` : "") : `<span class="error">worker stopped</span>`;
  const rows = state.jobs.slice(0, 15).map(j => {
    const p = j.params || {};
    const what = j.kind === "generate" ? `${p.count || (p.numbers || []).length} takes${p.numbers ? " (" + p.numbers.join(", ") + ")" : ""}${p.salt ? " salt " + esc(p.salt) : ""}`
      : j.kind === "ingame" ? (p.take ? `take ${p.take}` : "pick") : "";
    const actions = (j.status === "queued" || j.status === "running" ? `<button data-job-cancel="${j.id}">Cancel</button>` : "") +
      (j.status === "failed" || j.status === "cancelled" ? `<button data-job-retry="${j.id}">Retry</button>` : "") +
      `<button data-job-log="${j.id}">${openLogs.has(j.id) ? "Hide log" : "Log"}</button>`;
    return `<tr><td class="num">${j.id}</td><td>${esc(j.kind)}</td><td>${esc(j.line || "")}</td><td>${what}</td>
      <td class="status-${j.status}">${j.status}${j.stage ? ": " + esc(j.stage) : ""}${j.error && j.status !== "cancelled" ? `<br><small class="error">${esc(j.error)}</small>` : ""}${j.note ? `<br><small>${esc(j.note)}</small>` : ""}</td>
      <td>${who(j.by)}</td><td class="hide-narrow"><small>${when(j.created_at)}</small></td><td><div class="row">${actions}</div></td></tr>` +
      (openLogs.has(j.id) ? `<tr><td colspan="8"><div class="log" id="log-${j.id}">loading…</div></td></tr>` : "");
  }).join("");
  $("#jobs").innerHTML = state.jobs.length ? `<table><tr><th>#</th><th>job</th><th>line</th><th></th><th>status</th><th>by</th><th class="hide-narrow">queued</th><th></th></tr>${rows}</table>` : `<small>No jobs yet.</small>`;
  openLogs.forEach(loadLog);
}
async function loadLog(id) {
  const el = $("#log-" + id); if (!el) return;
  const r = await api("GET", `/api/jobs/${id}?tail=80`);
  el.textContent = r.job.log_tail.join("\n") || "(empty)"; el.scrollTop = el.scrollHeight;
}

// ---------- lines
function ratingButtons(line, t) {
  const mine = t.ratings.user || {};
  const others = Object.entries(t.ratings).filter(([by]) => by !== "user").map(([by, r]) =>
    `<div class="rating-note">${who(by)}: ${esc(r.rating || "")}${r.note ? " — " + esc(r.note) : ""}</div>`).join("");
  return `<div class="row">
      <button class="${mine.rating === "good" ? "on" : ""}" data-rate="good" data-line="${esc(line.name)}" data-take="${t.n}">good</button>
      <button class="bad ${mine.rating === "bad" ? "on" : ""}" data-rate="bad" data-line="${esc(line.name)}" data-take="${t.n}">bad</button>
      <button data-note data-line="${esc(line.name)}" data-take="${t.n}" title="Add a note">note</button></div>
      ${mine.note ? `<div class="rating-note">${who("user")}: ${esc(mine.note)}</div>` : ""}${others}`;
}
function takesTable(line) {
  if (!line.takes.length) return `<small>No takes yet.</small>`;
  const rows = line.takes.map(t => {
    const q = t.qa || {}, m = t.master || {};
    return `<tr class="${t.picked ? "picked" : ""} ${t.stale ? "stale" : ""}">
      <td class="num"><b>${t.n}</b>${t.picked ? ` <span class="chip" title="picked by ${esc(line.pick.by)}">pick</span>` : ""}${t.best ? ` <span class="chip" title="QA's best">QA best</span>` : ""}
        ${t.stale ? `<br><span class="chip warn" title="${esc(t.text)} (${esc(t.style)})">old text</span>` : ""}</td>
      <td>${play(t.mastered_url, "mastered")} ${play(t.raw_url, "raw model output")}<small class="hide-narrow"> raw</small></td>
      <td>${esc(q.heard || "")}</td>
      <td class="num">${q.cer !== undefined ? fmt(q.cer, 2) : ""}</td><td class="num">${q.wer !== undefined ? fmt(q.wer, 2) : ""}</td>
      <td class="num">${fmt(q.similarity)}</td>
      <td class="num">${q.seconds ? fmt(q.seconds, 2) + " s" : ""}</td>
      <td class="num hide-narrow" title="mastering: level gain, EQ, stereo">${m.gain_db !== undefined ? (m.gain_db >= 0 ? "+" : "") + fmt(m.gain_db, 1) + " dB" : ""}${m.eq === false ? " no EQ" : ""}${m.stereo === false ? " mono" : ""}</td>
      <td>${ratingButtons(line, t)}</td>
      <td><div class="row">${t.picked ? "" : `<button data-pick="${t.n}" data-line="${esc(line.name)}">Pick</button>`}
        ${t.mastered_url ? `<button data-ingame="${t.n}" data-line="${esc(line.name)}" title="Play this take in a game">In game</button>` : ""}</div></td></tr>`;
  }).join("");
  return `<div class="wrap"><table><tr><th>take</th><th>listen</th><th>Whisper heard</th><th>CER</th><th>WER</th><th title="speaker similarity to the clips">voice</th><th>length</th><th class="hide-narrow">master</th><th>rating</th><th></th></tr>${rows}</table></div>`;
}
function ingameList(line) {
  if (!line.ingame.length) return "";
  return `<h3>In the game</h3>` + line.ingame.map(g => {
    const l = g.line || {}, s = g.stock;
    return `<div class="row">${play(g.url, "the game's mix")} <span>take ${g.take}, ${when(g.at)}:
      the line at ${fmt(l.at - g.clip_start, 1)} s of the clip (correlation ${fmt(l.correlation)}, ${l.gain_db >= 0 ? "+" : ""}${fmt(l.gain_db, 1)} dB, speech ${fmt(l.speech_dbfs, 1)} dBFS)${s ? `; the announcer's "Slayer." at ${fmt(s.at - g.clip_start, 1)} s (correlation ${fmt(s.correlation)}, speech ${fmt(s.speech_dbfs, 1)} dBFS)` : ""}</span></div>`;
  }).join("");
}
function commentsBlock(line) {
  const top = line.comments.filter(c => !c.reply_to);
  const replies = id => line.comments.filter(c => c.reply_to === id);
  const one = (c, reply) => `<div class="comment ${reply ? "reply" : ""}"><small>${who(c.by)} · ${when(c.at)}</small><p>${esc(c.text)}</p>
     <div class="row">${reply ? "" : `<button data-reply="${c.id}" data-line="${esc(line.name)}">Reply</button>`}
     ${c.by === "user" ? `<button data-del-comment="${c.id}" data-line="${esc(line.name)}">Delete</button>` : ""}</div></div>`;
  return `<details class="comments" data-key="comments-${esc(line.name)}" ${line.comments.length ? "open" : ""}><summary><h3 style="display:inline">Comments (${line.comments.length})</h3></summary>
    ${top.map(c => one(c, false) + replies(c.id).map(r => one(r, true)).join("")).join("")}
    <div class="row" style="margin-top:6px"><textarea data-key="comment-${esc(line.name)}" placeholder="Comment on ${esc(line.name)}"></textarea>
    <button data-comment data-line="${esc(line.name)}">Comment</button></div></details>`;
}
function lineCard(line) {
  const m = line.mastering, n = esc(line.name);
  const busy = line.jobs.length ? ` <span class="chip warn">job ${line.jobs.join(", ")}</span>` : "";
  if (line.archived) return `<div class="card archived" data-line-card="${n}"><div class="card-head"><span class="name">${n}</span><span>“${esc(line.text)}”</span>
     <span class="chip ${esc(line.style)}">${esc(line.style)}</span><span class="grow"></span>
     <button data-unarchive data-line="${n}">Restore</button><button data-delete data-line="${n}">Delete for good</button></div></div>`;
  return `<div class="card" data-line-card="${n}">
    <div class="card-head"><span class="name">${n}</span><span class="text">“${esc(line.text)}”</span>
      <span class="chip ${esc(line.style)}">${esc(line.style)}</span>${busy}
      <small>${line.pick ? `pick: take ${line.pick.take} (${who(line.pick.by)})` : "no pick"}</small></div>
    ${takesTable(line)}
    ${ingameList(line)}
    <div class="tools">
      <div><b>Generate</b> <select data-key="count-${n}">${[1,2,3,4,6,8].map(c => `<option ${c === 2 ? "selected" : ""}>${c}</option>`).join("")}</select> takes
        <input data-key="salt-${n}" placeholder="seed salt (optional)" size="14"><button class="primary" data-generate data-line="${n}">Generate</button></div>
      <div><b>Master</b> trim <input data-key="gain-${n}" type="number" step="0.5" min="-12" max="6" value="${m.gain_db}" style="width:64px"> dB
        <label><input type="checkbox" data-key="eq-${n}" ${m.eq ? "checked" : ""}> EQ match</label>
        <label><input type="checkbox" data-key="stereo-${n}" ${m.stereo ? "checked" : ""}> stereo</label>
        <button data-master data-line="${n}">Re-master</button></div>
      <div>${line.pick ? `<button data-ingame-pick data-line="${n}">Hear the pick in game</button>` : ""}</div>
      <div><details data-key="edit-${n}"><summary>Edit</summary><div class="row" style="margin-top:4px">
        <input data-key="text-${n}" value="${esc(line.text)}" size="30">
        <select data-key="style-${n}"><option ${line.style === "calm" ? "selected" : ""}>calm</option><option ${line.style === "hype" ? "selected" : ""}>hype</option></select>
        <button data-edit data-line="${n}">Save</button><button data-archive data-line="${n}">Archive</button></div></details></div>
    </div>
    ${commentsBlock(line)}
  </div>`;
}

// redraw only the lines that changed, keeping what is being typed
function renderLines() {
  const active = document.activeElement;
  for (const [container, archived] of [[$("#lines"), false], [$("#archived"), true]]) {
    const lines = state.lines.filter(l => l.archived === archived);
    const names = new Set(lines.map(l => l.name));
    container.querySelectorAll("[data-line-card]").forEach(el => { if (!names.has(el.dataset.lineCard)) { el.remove(); rendered.delete(el.dataset.lineCard + archived); } });
    let previous = null;
    for (const line of lines) {
      const key = line.name + archived, json = JSON.stringify(line);
      let el = container.querySelector(`[data-line-card="${CSS.escape(line.name)}"]`);
      if (!el || rendered.get(key) !== json) {
        if (el && active && el.contains(active) && active.matches("input, textarea, select")) { previous = el; continue; }
        const keep = {};
        if (el) el.querySelectorAll("[data-key]").forEach(i => { keep[i.dataset.key] = i.tagName === "DETAILS" ? i.open : (i.type === "checkbox" ? i.checked : i.value); });
        const t = document.createElement("template"); t.innerHTML = lineCard(line).trim();
        const fresh = t.content.firstElementChild;
        fresh.querySelectorAll("[data-key]").forEach(i => {
          const k = i.dataset.key; if (!(k in keep)) return;
          if (i.tagName === "DETAILS") i.open = keep[k];
          else if (k.startsWith("comment-") || k.startsWith("salt-") || k.startsWith("count-")) i.value = keep[k];
        });
        if (el) el.replaceWith(fresh); else container.appendChild(fresh);
        el = fresh; rendered.set(key, json);
      }
      if (previous && previous.nextElementSibling !== el) previous.after(el);
      previous = el;
    }
  }
  $("#archived").closest("section").style.display = state.lines.some(l => l.archived) ? "" : "none";
  markPlaying();
}
function renderFeed() {
  $("#feed").innerHTML = state.activity.map(a => {
    const d = a.detail || {};
    const extra = a.action === "edit_line" ? Object.entries(d.changes || {}).map(([k, v]) => `${k}: “${esc(v.from)}” → “${esc(v.to)}”`).join(", ")
      : a.action.startsWith("job_") ? `job ${d.job} (${esc(d.kind)})${d.error && d.status !== "cancelled" ? ": " + esc(d.error) : ""}`
      : a.action.startsWith("queue_") ? `job ${d.job}${d.count ? `, ${d.count} takes` : ""}${d.take ? `, take ${d.take}` : ""}`
      : a.action === "rate" ? esc(d.rating || "") : "";
    return `<div><small>${when(a.at)}</small> ${who(a.by)} <b>${esc(a.action.replace(/_/g, " "))}</b>${a.line ? " " + esc(a.line) : ""}${a.take ? " take " + a.take : ""}
      ${extra ? " · " + extra : ""}${a.text ? ` · <span class="muted">${esc(a.text)}</span>` : ""}</div>`;
  }).join("");
}
function render() { renderJobs(); renderLines(); renderFeed(); }

// ---------- actions
const val = key => { const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`); return el ? (el.type === "checkbox" ? el.checked : el.value) : undefined; };
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b || b.classList.contains("play")) return;
  const d = b.dataset, line = d.line, enc = encodeURIComponent(line || "");
  try {
    if ("rate" in d) {
      const t = state.lines.find(l => l.name === line).takes.find(t => t.n == d.take);
      const mine = t.ratings.user || {};
      await post(`/api/lines/${enc}/takes/${d.take}/rate`, {rating: mine.rating === d.rate ? null : d.rate, note: mine.note || null});
    } else if ("note" in d) {
      const t = state.lines.find(l => l.name === line).takes.find(t => t.n == d.take);
      const mine = t.ratings.user || {};
      const note = prompt(`Note on ${line} take ${d.take}:`, mine.note || ""); if (note === null) return;
      await post(`/api/lines/${enc}/takes/${d.take}/rate`, {rating: mine.rating || null, note: note.trim() || null});
    } else if ("pick" in d) await post(`/api/lines/${enc}/pick`, {take: Number(d.pick)});
    else if ("ingame" in d) await post(`/api/lines/${enc}/ingame`, {take: Number(d.ingame)});
    else if ("ingamePick" in d) await post(`/api/lines/${enc}/ingame`, {});
    else if ("generate" in d) await post(`/api/lines/${enc}/generate`, {count: Number(val("count-" + line)), salt: val("salt-" + line) || undefined});
    else if ("master" in d) await post(`/api/lines/${enc}/mastering`, {gain_db: Number(val("gain-" + line)), eq: val("eq-" + line), stereo: val("stereo-" + line), remaster: true});
    else if ("edit" in d) await post(`/api/lines/${enc}/edit`, {text: val("text-" + line), style: val("style-" + line)});
    else if ("archive" in d) { if (confirm(`Archive ${line}? (It can be restored.)`)) await post(`/api/lines/${enc}/archive`); }
    else if ("unarchive" in d) await post(`/api/lines/${enc}/unarchive`);
    else if ("delete" in d) { if (confirm(`Delete ${line} and its audio for good?`)) await post(`/api/lines/${enc}/delete`); }
    else if ("comment" in d) {
      const el = document.querySelector(`[data-key="comment-${CSS.escape(line)}"]`);
      if (!el.value.trim()) return;
      await post(`/api/lines/${enc}/comments`, {text: el.value}); el.value = "";
    } else if ("reply" in d) {
      const text = prompt("Reply:"); if (!text || !text.trim()) return;
      await post(`/api/lines/${enc}/comments`, {text, reply_to: Number(d.reply)});
    } else if ("delComment" in d) {
      if (confirm("Delete this comment?")) await post(`/api/lines/${enc}/comments/${d.delComment}/delete`);
    } else if ("jobCancel" in d) await post(`/api/jobs/${d.jobCancel}/cancel`);
    else if ("jobRetry" in d) await post(`/api/jobs/${d.jobRetry}/retry`);
    else if ("jobLog" in d) { const id = Number(d.jobLog); openLogs.has(id) ? openLogs.delete(id) : openLogs.add(id); renderJobs(); }
    else if (b.id === "install") { const r = await post("/api/install"); alert(`Installed ${Object.keys(r.installed).length} lines into ${r.folder}:\n` + r.output.join("\n")); }
  } catch (err) { console.error(err); }
});
document.addEventListener("focusout", () => setTimeout(() => { if (state) renderLines(); }, 50));
$("#add").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await post("/api/lines", {name: f.get("name"), text: f.get("text"), style: f.get("style"), generate: Number(f.get("generate")) || undefined});
    e.target.reset();
  } catch (err) { console.error(err); }
});

// ---------- the state, long-polled
async function poll() {
  for (;;) {
    try {
      const r = await fetch(`/api/state?wait=${version}&timeout=25`);
      if (!r.ok) throw new Error(r.statusText);
      const s = await r.json();
      if (s.version !== version) { state = s; version = s.version; render(); }
      else if (openLogs.size) openLogs.forEach(loadLog);
    } catch (err) { await new Promise(res => setTimeout(res, 3000)); }
  }
}
loadOriginals();
poll();
setInterval(() => { if (state && state.worker.running && openLogs.size) openLogs.forEach(loadLog); }, 4000);
</script>
</body>
</html>
